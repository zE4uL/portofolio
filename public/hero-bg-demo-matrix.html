<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hero BG — Matrix Rain Portrait</title>
<style>
  :root {
    --bg: #000;
    --green: #ffffff;
    --green-dim: #2a2a2a;
    --head: #ffffff;
    --accent: #ff3b1f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--green);
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    overflow: hidden; cursor: none;
  }
  #stage { position: fixed; inset: 0; }
  canvas#rain { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background:
      radial-gradient(120% 80% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0, rgba(0,0,0,.18) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
  }

  .hero {
    position: relative; z-index: 2;
    height: 100%; width: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 32px 40px;
    pointer-events: none;
    color: #d8ffe6;
  }
  .top, .bottom { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
  .top span, .bottom span { text-shadow: 0 0 8px rgba(255,255,255,.45); }
  .center { align-self: center; text-align: center; transform: translateY(-3vh); }
  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
    margin-bottom: 24px; color: var(--green);
    text-shadow: 0 0 10px rgba(255,255,255,.45);
  }
  h1 {
    font-family: "Instrument Serif", "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(56px, 11vw, 180px);
    line-height: .92;
    letter-spacing: -.02em;
    color: #e6ffec;
    text-shadow: 0 0 14px rgba(255,255,255,.4), 0 0 38px rgba(255,255,255,.18);
  }
  h1 em { font-style: normal; color: #ffffff; opacity: .85; }
  .sub {
    margin-top: 28px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; letter-spacing: .04em; opacity: .85;
    max-width: 560px; margin-inline: auto;
    color: #b8ffcb;
  }
  .hud {
    position: fixed; bottom: 24px; right: 24px; z-index: 5;
    display: flex; gap: 8px; flex-direction: column;
    background: rgba(0,20,8,.55); backdrop-filter: blur(8px);
    border: 1px solid rgba(0,255,65,.22);
    padding: 14px 16px; border-radius: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    pointer-events: auto;
    color: #b8ffcb;
  }
  .hud label { display: flex; justify-content: space-between; gap: 14px; align-items: center; opacity: .9; }
  .hud input[type=range] { width: 140px; accent-color: var(--green); }
  .hud .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .hud button {
    background: transparent; color: #b8ffcb;
    border: 1px solid rgba(0,255,65,.3);
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    font: inherit; letter-spacing: .08em; text-transform: uppercase;
  }
  .hud button.on { background: var(--green); border-color: var(--green); color: #001405; }
  .cursor-ring {
    position: fixed; top: 0; left: 0; width: 30px; height: 30px;
    border: 1.5px solid var(--green); border-radius: 50%;
    pointer-events: none; z-index: 4;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 22px rgba(0,255,65,.7);
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="rain"></canvas>
    <div class="vignette"></div>
    <div class="hero">
      <div class="top">
        <span>// ZIAUL.ISLAM</span>
        <span>SYS:: PORTFOLIO_2026</span>
      </div>
      <div class="center">
        <div class="eyebrow">&gt; SENIOR_PRODUCT_DESIGNER</div>
        <h1>Decoded from<br/><em>noise</em>.</h1>
        <p class="sub">[ move cursor :: streams glitch around the pointer ]</p>
      </div>
      <div class="bottom">
        <span>SCROLL ↓</span>
        <span>v0.1 · matrix</span>
      </div>
    </div>
    <div class="cursor-ring" id="ring"></div>
  </div>

  <div class="hud">
    <label>Char size <input id="size" type="range" min="10" max="22" step="1" value="14"></label>
    <label>Speed <input id="speed" type="range" min="20" max="200" step="5" value="80"></label>
    <label>Density <input id="density" type="range" min="20" max="100" step="2" value="68"></label>
    <label>Magnet R <input id="magR" type="range" min="40" max="320" step="10" value="150"></label>
    <label>Force <input id="force" type="range" min="0" max="100" step="1" value="65"></label>
    <div class="row">
      <button id="modeRepel" class="on">Glitch repel</button>
      <button id="modeAttract">Magnet pull</button>
      <button id="modeScramble">Scramble</button>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const ring = document.getElementById('ring');

  const IMG_SRC = '/images/profile/NanoBanana-2026-04-28.png';

  // Digits only — clean monochrome readout
  const CHARS = "0123456789";

  const state = {
    dpr: Math.min(window.devicePixelRatio || 1, 2),
    w: 0, h: 0,
    cols: 0, rows: 0,
    charW: 14, charH: 18,
    columns: [],     // [{ headRow, speed, length }]
    cells: null,     // Uint8Array of char indices, rows*cols
    lum: null,       // Float32Array of image luminance per cell, rows*cols (0..1, 0 = bg)
    flash: null,     // Float32Array of head-pass flash per cell, rows*cols (0..1)
    mouse: { x: -9999, y: -9999, active: false },
    config: {
      charSize: 14,        // base font px
      speed: 80,           // px/sec for column scroll
      density: 0.68,       // % of columns that are active streams
      magR: 150,
      force: 0.65,
      mode: 'repel',       // repel | attract | scramble
    },
    img: null,
    imgData: null,
    imgSize: null,
    bg: null,
  };

  function resize() {
    state.w = window.innerWidth;
    state.h = window.innerHeight;
    canvas.width = state.w * state.dpr;
    canvas.height = state.h * state.dpr;
    canvas.style.width = state.w + 'px';
    canvas.style.height = state.h + 'px';
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    if (state.img) buildGrid();
  }

  function loadImage() {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = IMG_SRC;
    });
  }

  function sampleImage(img) {
    const targetW = 480;
    const ratio = img.height / img.width;
    const targetH = Math.round(targetW * ratio);
    const off = document.createElement('canvas');
    off.width = targetW; off.height = targetH;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0, targetW, targetH);
    state.imgData = octx.getImageData(0, 0, targetW, targetH);
    state.imgSize = { w: targetW, h: targetH };

    const sampleCorner = (cx, cy) => {
      let r = 0, g = 0, b = 0, n = 0;
      for (let y = cy; y < cy + 8; y++) {
        for (let x = cx; x < cx + 8; x++) {
          const i = (y * targetW + x) * 4;
          r += state.imgData.data[i]; g += state.imgData.data[i+1]; b += state.imgData.data[i+2]; n++;
        }
      }
      return [r/n, g/n, b/n];
    };
    const corners = [
      sampleCorner(0, 0),
      sampleCorner(targetW - 8, 0),
      sampleCorner(0, targetH - 8),
      sampleCorner(targetW - 8, targetH - 8),
    ];
    const bg = corners.reduce((a, c) => [a[0]+c[0], a[1]+c[1], a[2]+c[2]], [0,0,0]).map(v => v / corners.length);
    state.bg = { r: bg[0], g: bg[1], b: bg[2] };
  }

  function buildGrid() {
    const cs = state.config.charSize;
    state.charW = cs * 0.72;            // monospace approx — px per col
    state.charH = cs * 1.18;
    state.cols = Math.ceil(state.w / state.charW);
    state.rows = Math.ceil(state.h / state.charH);

    const total = state.cols * state.rows;
    state.cells = new Uint8Array(total);
    state.lum = new Float32Array(total);
    state.flash = new Float32Array(total);

    // initialize random characters
    for (let i = 0; i < total; i++) {
      state.cells[i] = (Math.random() * CHARS.length) | 0;
    }

    // map image into the grid — cover-fit, centered
    const { imgSize, bg } = state;
    const aspectImg = imgSize.w / imgSize.h;
    const aspectGrid = (state.cols * state.charW) / (state.rows * state.charH);
    let drawW, drawH;
    if (aspectGrid > aspectImg) {
      drawH = state.rows * state.charH * 0.95;
      drawW = drawH * aspectImg;
    } else {
      drawW = state.cols * state.charW * 0.6;
      drawH = drawW / aspectImg;
    }
    const drawX = (state.w - drawW) / 2;
    const drawY = (state.h - drawH) / 2;
    state.imgRect = { x: drawX, y: drawY, w: drawW, h: drawH };

    // sample image luminance for every cell
    const data = state.imgData.data;
    for (let row = 0; row < state.rows; row++) {
      for (let col = 0; col < state.cols; col++) {
        const cx = col * state.charW + state.charW / 2;
        const cy = row * state.charH + state.charH / 2;
        const ix = (cx - drawX) / drawW;
        const iy = (cy - drawY) / drawH;
        let l = 0;
        if (ix >= 0 && ix < 1 && iy >= 0 && iy < 1) {
          const sx = (ix * imgSize.w) | 0;
          const sy = (iy * imgSize.h) | 0;
          const idx = (sy * imgSize.w + sx) * 4;
          const r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
          if (a > 64) {
            const dr = r - bg.r, dg = g - bg.g, db = b - bg.b;
            const dist2 = dr*dr + dg*dg + db*db;
            // looser threshold — 14/channel — keeps skin tones
            if (dist2 >= 14*14*3) {
              // weight by both luminance and distance from bg, so even
              // mid-tone skin contributes; full silhouette reads
              const lumRaw = (0.299*r + 0.587*g + 0.114*b) / 255;
              const sep = Math.min(1, Math.sqrt(dist2) / 220);
              l = Math.max(lumRaw, sep * 0.55);
            }
          }
        }
        state.lum[row * state.cols + col] = l;
      }
    }

    // columns: per-col head, speed, active flag
    state.columns = [];
    for (let c = 0; c < state.cols; c++) {
      const active = Math.random() < state.config.density;
      state.columns.push({
        // start scattered through the visible area so streams show immediately
        head: Math.random() * state.rows,
        speed: 0.6 + Math.random() * 1.6,
        length: 10 + ((Math.random() * 20) | 0),
        active,
      });
    }
  }

  let last = performance.now();
  let firstFrame = true;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const cfg = state.config;
    const { cols, rows, charW, charH, lum, flash, cells, columns } = state;

    // first frame: clear to fully black so the face emerges instantly
    if (firstFrame) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, state.w, state.h);
      firstFrame = false;
    } else {
      // motion-blur trail by drawing translucent black instead of full clear
      ctx.fillStyle = 'rgba(0, 0, 0, 0.14)';
      ctx.fillRect(0, 0, state.w, state.h);
    }

    ctx.font = `${cfg.charSize}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
    ctx.textBaseline = 'top';

    // advance heads + write flash
    const rowsPerSec = cfg.speed / charH;
    for (let c = 0; c < cols; c++) {
      const col = columns[c];
      if (!col.active) continue;
      col.head += rowsPerSec * col.speed * dt;
      if (col.head - col.length > rows + 4) {
        col.head = -Math.random() * 8;
        col.speed = 0.6 + Math.random() * 1.6;
        col.length = 8 + ((Math.random() * 18) | 0);
      }
      const headRow = col.head | 0;
      if (headRow >= 0 && headRow < rows) {
        flash[headRow * cols + c] = 1;
      }
    }

    // randomly mutate some cells (matrix character churn)
    const churnPerFrame = (cols * rows * 0.012) | 0;
    for (let i = 0; i < churnPerFrame; i++) {
      const idx = (Math.random() * cols * rows) | 0;
      cells[idx] = (Math.random() * CHARS.length) | 0;
    }

    // mouse params
    const mx = state.mouse.x, my = state.mouse.y;
    const magR = cfg.magR;
    const magR2 = magR * magR;

    // render every cell
    for (let r = 0; r < rows; r++) {
      const yPx = r * charH;
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        const baseLum = lum[idx];   // 0 outside the face, 0..1 inside
        const f = flash[idx];
        const col = columns[c];

        // distance from this row to the column's stream head (in rows)
        const distFromHead = (col.head | 0) - r;
        const inStream = col.active && distFromHead >= 0 && distFromHead < col.length;
        const headHere = col.active && distFromHead === 0;
        const tail = inStream ? (1 - distFromHead / col.length) : 0; // 1 at head → 0 at tail

        // FACE LAYER — bright persistent reveal
        const faceA = baseLum > 0.02
          ? Math.min(1, 0.35 + Math.pow(baseLum, 0.5) * 0.85)
          : 0;

        // RAIN LAYER — every active column shows a stream tail
        let rainA = 0;
        if (inStream) {
          rainA = 0.18 + tail * 0.45;
          if (baseLum > 0.05) rainA += baseLum * 0.3;
        }

        // HEAD — bright leading character
        const headA = headHere ? 1 : 0;

        // FLASH — recently-passed cells flare and decay
        let flashA = 0;
        if (f > 0) {
          flashA = f * 0.45;
          flash[idx] = f - dt * 1.6;
          if (flash[idx] < 0) flash[idx] = 0;
        }

        // combine layers
        let alpha = Math.max(faceA, rainA, headA) + flashA * 0.4;
        if (alpha < 0.02) continue;
        if (alpha > 1) alpha = 1;

        let xPx = c * charW;
        let glitching = false;

        // cursor warp
        if (state.mouse.active) {
          const dx = (xPx + charW/2) - mx;
          const dy = (yPx + charH/2) - my;
          const d2 = dx*dx + dy*dy;
          if (d2 < magR2) {
            const d = Math.sqrt(d2) || 1;
            const ff = 1 - d / magR;
            const strength = ff * ff * 28 * cfg.force;
            if (cfg.mode === 'repel') {
              xPx += (dx / d) * strength;
            } else if (cfg.mode === 'attract') {
              xPx -= (dx / d) * strength;
            } else if (cfg.mode === 'scramble') {
              glitching = ff > 0.4;
              cells[idx] = (Math.random() * CHARS.length) | 0;
            }
          }
        }

        // pure white only — head pops slightly brighter, glitch flickers
        const v = headHere ? 255 : 240;
        ctx.fillStyle = glitching && Math.random() < 0.5
          ? `rgba(255,255,255,${alpha * 0.4})`
          : `rgba(${v},${v},${v},${alpha})`;

        ctx.fillText(CHARS[cells[idx]], xPx, yPx);
      }
    }

    requestAnimationFrame(frame);
  }

  function bindMouse() {
    window.addEventListener('pointermove', (e) => {
      state.mouse.x = e.clientX;
      state.mouse.y = e.clientY;
      state.mouse.active = true;
      ring.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%,-50%)`;
    });
    window.addEventListener('pointerleave', () => { state.mouse.active = false; });
  }

  function bindHud() {
    const $ = (id) => document.getElementById(id);
    $('size').addEventListener('input', (e) => {
      state.config.charSize = +e.target.value;
      buildGrid();
    });
    $('speed').addEventListener('input', (e) => { state.config.speed = +e.target.value; });
    $('density').addEventListener('input', (e) => {
      state.config.density = +e.target.value / 100;
      // reroll active flags only
      for (let i = 0; i < state.columns.length; i++) {
        state.columns[i].active = Math.random() < state.config.density;
      }
    });
    $('magR').addEventListener('input', (e) => { state.config.magR = +e.target.value; });
    $('force').addEventListener('input', (e) => { state.config.force = +e.target.value / 100; });

    const setMode = (m) => {
      state.config.mode = m;
      ['modeRepel', 'modeAttract', 'modeScramble'].forEach(id => $(id).classList.remove('on'));
      $('mode' + m[0].toUpperCase() + m.slice(1)).classList.add('on');
    };
    $('modeRepel').onclick    = () => setMode('repel');
    $('modeAttract').onclick  = () => setMode('attract');
    $('modeScramble').onclick = () => setMode('scramble');
  }

  async function init() {
    bindMouse();
    bindHud();
    window.addEventListener('resize', resize);

    try {
      state.img = await loadImage();
      sampleImage(state.img);
    } catch (err) {
      console.error('Failed to load image at', IMG_SRC, err);
      return;
    }

    resize();
    last = performance.now();
    requestAnimationFrame(frame);
  }

  init();
})();
</script>
</body>
</html>
